<body><div class="wrap">
<header><h1>CLO–PLO Attainment ERP</h1><span class="mu" id="sub"></span><span id="who" class="noprint"></span></header>
<div id="ws" class="noprint"></div><nav id="nav"></nav><div id="steps" class="steps noprint"></div><div id="warn"></div><main id="main"></main>
</div>
<script>
/* ---------- State, helpers ---------- */
const KEY='obe_erp_v1',BL=['Remember','Understand','Apply','Analyze','Evaluate','Create'];
const uid=()=>'i'+Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const PN=['Business knowledge','Communication','Critical thinking','Leadership & teamwork','Ethics & sustainability','Innovation & entrepreneurship','Digital literacy','Research & inquiry','Global perspective','Lifelong learning'];
// Every threshold/weight lives in state (editable in Setup) – nothing is hard-coded in the formulas.
const def=()=>({prog:'BBA, BAUET',sem:'Summer-2026',thr:40,lv:[70,60,50],wD:80,wI:20,sw:[50,25,25],tC:60,tP:60,plos:PN.map((n,i)=>({id:'PLO'+(i+1),n})),courses:[],ind:{},cqi:{}});
let S,tab='guide',cur=0,ch=[];
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S&&S.plos?S:null;
if(!S||(!S.courses.length&&!S.seeded))S=sample();   // first visit (or empty old save): start with the 30-student sample courses
const save=()=>{clearTimeout(_t);_t=setTimeout(()=>{if(WK)wsDoc().catch(()=>alert('Could not save. Check your connection and try again.'))},500)};
const U=f=>{f();save();draw()};                       // update -> save -> redraw (live calculation)
const n1=v=>v==null||isNaN(v)?'–':String(Math.round(v*10)/10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=(v,f)=>`<span class="f" title="${esc(f)}">${v==null?'–':n1(v)+'%'}</span>`;   // number + formula tooltip
const B=(t,c)=>`<span class="b ${c}">${t}</span>`;
const inp=(v,s,t='text',x='')=>`<input type="${t}" value="${esc(v)}" ${t==='number'?'step="any"':''} ${x} onchange="U(()=>{${s}})">`;
// Attainment level from editable cut-offs S.lv = [L3, L2, L1]
const lvl=(a,s=S)=>a==null?['–','']:a>=s.lv[0]?['Level 3 (High)','ok']:a>=s.lv[1]?['Level 2 (Medium)','ok']:a>=s.lv[2]?['Level 1 (Low)','wn']:['Not attained','bd'];

/* ---------- Calculation engine ---------- */
function calc(s=S){
 const clo=[];
 s.courses.forEach((co,ci)=>{const n=co.st.length;
  co.clos.forEach((c,k)=>{
   const qs=co.as.flatMap(a=>a.q.filter(q=>q.c===c.id));      // questions linked to this CLO
   const tot=qs.reduce((x,q)=>x+q.mx,0);                       // total CLO marks
   // Student CLO score % = marks in CLO questions / total CLO marks x 100
   const sc=co.st.map(st=>tot?qs.reduce((x,q)=>x+(+st.m[q.id]||0),0)/tot*100:0);
   const ok=sc.filter(v=>v>=s.thr).length;                      // students at/above threshold
   const att=n&&tot?ok/n*100:null;                              // class CLO attainment %
   clo.push({ci,c,lab:co.code+' CLO'+(k+1),sc,tot,ok,n,att});
  })});
 // Weighted average of mapped CLO attainments: sum(w x att) / sum(w)
 const agg=l=>{const w=l.filter(r=>r.w>0&&r.att!=null),d=w.reduce((x,r)=>x+r.w,0);
  return d?{v:w.reduce((x,r)=>x+r.w*r.att,0)/d,f:'('+w.map(r=>r.w+'×'+n1(r.att)).join(' + ')+') ÷ '+d}:null};
 const plo=s.plos.map(p=>{
  const it=clo.map(r=>({...r,w:+r.c.m[p.id]||0}));
  const d=agg(it);
  // Indirect % = weighted mean of exit / alumni / employer survey % (blank surveys skipped)
  let sn=0,sd=0;(s.ind[p.id]||[]).forEach((v,i)=>{if(v!==''&&v!=null&&!isNaN(v)){sn+=v*s.sw[i];sd+=s.sw[i]}});
  const ind=sd?sn/sd:null;
  // Combined = (wD x Direct + wI x Indirect) / (wD + wI); direct only if no survey data
  const comb=d&&ind!=null?(s.wD*d.v+s.wI*ind)/(s.wD+s.wI):d?d.v:null;
  return{p,d,ind,comb,byC:s.courses.map((co,ci)=>({co,a:agg(it.filter(r=>r.ci===ci))}))};
 });
 return{clo,plo};
}
// Validation: weights, level order, empty mappings, unlinked questions
function issues(){const r=[];
 if(S.wD+S.wI!==100)r.push('Direct + indirect weights must total 100 (now '+(S.wD+S.wI)+').');
 if(S.sw.reduce((a,b)=>a+b,0)!==100)r.push('Survey weights (exit + alumni + employer) must total 100.');
 if(!(S.lv[0]>S.lv[1]&&S.lv[1]>S.lv[2]))r.push('Level cut-offs must descend: L3 > L2 > L1.');
 S.courses.forEach(co=>{
  co.clos.forEach((c,k)=>{
   if(!Object.values(c.m).some(v=>v>0))r.push(co.code+' CLO'+(k+1)+': no PLO mapping.');
   if(!co.as.some(a=>a.q.some(q=>q.c===c.id)))r.push(co.code+' CLO'+(k+1)+': no assessment question linked.')});
  co.as.forEach(a=>a.q.forEach(q=>{if(!co.clos.some(c=>c.id===q.c))r.push(co.code+' '+a.n+'.'+q.n+': no CLO selected.')}));
 });
 return r}

/* ---------- Sample (the worked example) ---------- */
function sample10(){const s=def();s.prog='BBA, BAUET (sample)';
 const c=[uid(),uid(),uid()],q=[uid(),uid(),uid(),uid(),uid()];
 const D=[[9,17,16,17,24],[8,15,14,15,21],[7,14,12,13,11],[10,18,17,18,26],[5,9,7,8,10],[6,11,8,7,11],[4,6,5,6,9],[8,16,13,14,22],[3,7,6,8,10],[9,15,15,16,25]];
 s.courses=[{code:'BUS 1102',name:'Introduction to Business',
  clos:[{id:c[0],t:'Explain core business functions and environments',b:'Understand',m:{PLO1:3}},
        {id:c[1],t:'Apply business concepts to organizational scenarios',b:'Apply',m:{PLO1:2,PLO3:2}},
        {id:c[2],t:'Analyze cases and propose data-backed solutions',b:'Analyze',m:{PLO3:3}}],
  as:[{n:'Quiz',q:[{id:q[0],n:'Q1',mx:10,c:c[0]}]},
      {n:'Midterm',q:[{id:q[1],n:'Q1',mx:20,c:c[0]},{id:q[2],n:'Q2',mx:20,c:c[1]}]},
      {n:'Final',q:[{id:q[3],n:'Q1',mx:20,c:c[1]},{id:q[4],n:'Q2',mx:30,c:c[2]}]}],
  st:D.map((r,i)=>({n:'S'+(i+1),m:Object.fromEntries(q.map((id,j)=>[id,r[j]]))}))}];
 s.ind={PLO1:[75,70,72],PLO3:[60,55,58]};return s}

// 30-student sample: two BBA courses, deterministic pseudo-random marks (fixed seeds), CLO3 set harder so some flags show red.
function sample(){const s=def();s.prog='BBA, BAUET (sample, 30 students)';
 const mk=(code,name,seed,T,B,M,off)=>{let x=seed;const r=()=>(x=(x*1664525+1013904223)%4294967296)/4294967296;
  const c=[uid(),uid(),uid()],q=[uid(),uid(),uid(),uid(),uid()],cj=[0,0,1,1,2],mx=[10,20,20,20,30],st=[];
  for(let i=1;i<=30;i++){const ab=.62+(r()+r()+r()-1.5)*.35,m={};
   q.forEach((id,j)=>{const v=ab+off[cj[j]]+(r()+r()+r()-1.5)*.2;m[id]=Math.round(Math.max(0,Math.min(1,v))*mx[j])});
   st.push({n:'S'+String(i).padStart(2,'0'),m})}
  return{code,name,clos:c.map((id,k)=>({id,t:T[k],b:B[k],m:M[k]})),
   as:[{n:'Quiz',q:[{id:q[0],n:'Q1',mx:10,c:c[0]}]},{n:'Midterm',q:[{id:q[1],n:'Q1',mx:20,c:c[0]},{id:q[2],n:'Q2',mx:20,c:c[1]}]},{n:'Final',q:[{id:q[3],n:'Q1',mx:20,c:c[1]},{id:q[4],n:'Q2',mx:30,c:c[2]}]}],st}};
 s.courses=[mk('BUS 1102','Introduction to Business',7,['Explain core business functions and environments','Apply business concepts to organizational scenarios','Analyze cases and propose data-backed solutions'],['Understand','Apply','Analyze'],[{PLO1:3},{PLO1:2,PLO3:2},{PLO3:3}],[.08,0,-.2]),
  mk('BUS 1201','Business Communication',19,['Explain principles of professional business communication','Prepare structured business reports and presentations','Create persuasive digital business messages'],['Understand','Apply','Create'],[{PLO2:3},{PLO2:3,PLO7:2},{PLO7:3}],[.05,-.02,-.18]),
  mk('ACT 1104','Financial Accounting',31,['Explain accounting concepts and the accounting cycle','Prepare journal entries, ledgers and financial statements','Analyze financial statements to support business decisions'],['Understand','Apply','Analyze'],[{PLO1:2},{PLO1:2,PLO3:2},{PLO3:2}],[.06,-.01,-.12])];
 s.ind={PLO1:[75,70,72],PLO2:[68,66,70],PLO3:[60,55,58],PLO7:[58,52,55]};s.seeded=1;return s}

/* ---------- Views ---------- */
const TABS=[['guide','Guideline'],['setup','Setup'],['clo','Course & CLO'],['plan','Assessment Plan'],['marks','Marks Entry'],['calc','Auto Calculation'],['dash','Dashboard'],['cqi','CQI'],['rep','Reports']];
const V={};
const sel=()=>S.courses.length?`<label data-keep>Course <select onchange="cur=+this.value;draw()">${S.courses.map((c,i)=>`<option value="${i}" ${i===cur?'selected':''}>${esc(c.code)} ${esc(c.name)}${can(i)?'':' (view only)'}</option>`).join('')}</select></label>`:'<p class="mu">No course yet. Add one in Setup, or load the sample data.</p>';
const dt=(t,b,o)=>`<details ${o?'open':''}><summary>${t}</summary>${b}</details>`;

function worked(){const w=sample10(),R=calc(w),co=w.courses[0];
 const hd=co.as.flatMap(a=>a.q.map(q=>a.n+'.'+q.n+' /'+q.mx));
 let h=`<p>Course ${co.code}, threshold ${w.thr}%. Marks and Step 1 (student CLO %):</p><div class="sc"><table><tr><th>Std${hd.map(x=>'<th>'+x).join('')}${R.clo.map(r=>'<th>'+r.lab.slice(-4)+' %').join('')}</tr>`+
  co.st.map((s,i)=>`<tr><td>${s.n}`+Object.values(s.m).map(v=>'<td>'+v).join('')+R.clo.map(r=>`<td class="${r.sc[i]>=w.thr?'ok':'bd'}">${n1(r.sc[i])}`).join('')).join('')+'</table></div>';
 h+=`<p><b>Step 1.</b> CLO marks: ${R.clo.map(r=>r.lab.slice(-4)+' = '+r.tot).join(', ')}. Score % = CLO marks obtained ÷ CLO total × 100.</p><p><b>Step 2.</b> Count students ≥ ${w.thr}% (green) and compute class attainment: ${R.clo.map(r=>`${r.lab.slice(-4)} = ${r.ok}/${r.n}×100 = ${n1(r.att)}% → ${lvl(r.att,w)[0]}`).join('; ')}.</p>`;
 h+=`<p><b>Step 3.</b> Direct PLO = weighted average of mapped CLOs: ${R.plo.filter(x=>x.d).map(x=>`${x.p.id} = ${x.d.f} = ${n1(x.d.v)}%`).join('; ')}.</p>`;
 h+=`<p><b>Step 4.</b> Indirect (weights ${w.sw.join('/')}): ${R.plo.filter(x=>x.ind!=null).map(x=>`${x.p.id} = (${w.sw[0]}×${w.ind[x.p.id][0]} + ${w.sw[1]}×${w.ind[x.p.id][1]} + ${w.sw[2]}×${w.ind[x.p.id][2]}) ÷ 100 = ${n1(x.ind)}%`).join('; ')}.</p>`;
 h+=`<p><b>Step 5.</b> Combined = ${w.wD}% × direct + ${w.wI}% × indirect: ${R.plo.filter(x=>x.d).map(x=>`${x.p.id} = ${n1(x.comb)}%`).join('; ')}. With a ${S.tP}% PLO target, PLO3 needs a CQI action.</p>`;
 return h}

V.guide=()=>{
 const rows=(a)=>a.map(r=>'<tr>'+r.map(x=>'<td>'+x).join('')+'</tr>').join('');
 return `<p class="mu">Short guide to outcome-based education (OBE) and attainment for BAC-style accreditation. Numbers below follow your live Setup values.</p>`+
 dt('1. OBE basics: PEO → PLO → CLO and Bloom’s levels',`<p><b>PEO</b>: what graduates achieve 3–5 years after graduation. <b>PLO</b>: what a graduate can do at graduation. <b>CLO</b>: what a student can do at the end of one course. Every CLO supports at least one PLO, and every PLO supports at least one PEO.</p><p>Example: PEO2 (leadership and data-driven decisions) → PLO3 (diagnose business problems with quantitative models) → CLO “Analyze a sales data set to recommend a pricing change”.</p><table><tr><th>Bloom level<th>Typical verbs</tr>${rows([['Remember','define, list, state'],['Understand','explain, summarize, classify'],['Apply','solve, compute, use, demonstrate'],['Analyze','compare, diagnose, differentiate'],['Evaluate','justify, critique, appraise'],['Create','design, develop, formulate']])}</table>`,1)+
 dt('2. Writing measurable CLOs',`<p>Pattern: <b>action verb + content + context + standard</b>. Avoid “understand” or “know” alone. Sample for CSE 101 Programming Language:</p><table><tr><th>CLO<th>Statement<th>Bloom<th>PLO</tr>${rows([['CLO1','Explain variables, data types and control structures used in C programs','Understand','PLO1'],['CLO2','Write C programs using loops, functions and arrays that pass at least 80% of given test cases','Apply','PLO2'],['CLO3','Develop a documented, modular mini-project in a team of three','Create','PLO5'],])}</table>`)+
 dt('3. CLO–PLO mapping matrix',`<p>Correlation: <b>3</b> = high (CLO directly develops and assesses the PLO), <b>2</b> = medium, <b>1</b> = low, blank = none. These numbers are the weights used in PLO attainment.</p><table><tr><th><th>PLO1<th>PLO2<th>PLO5</tr>${rows([['CLO1',3,'',''],['CLO2',1,3,''],['CLO3','',2,3]])}</table>`)+
 dt('4. Assessment mapping',`<table><tr><th>Tool<th>Typical CLO focus<th>Bloom range</tr>${rows([['Quizzes','Early CLOs (facts, concepts)','Remember–Understand'],['Assignments','Application CLOs','Apply–Analyze'],['Midterm','First half of CLOs','Understand–Apply'],['Final','Mixed, higher-order CLOs','Apply–Evaluate'],['Lab','Skill CLOs','Apply–Create'],['Project','Integrated, teamwork CLOs','Analyze–Create']])}</table><p>Rule: every question carries marks and one CLO. Each CLO needs at least two different assessment types.</p>`)+
 dt('5. Direct attainment calculation',`<ul><li>Student CLO score % = marks in CLO-linked questions ÷ total CLO marks × 100</li><li>Student attains the CLO if score ≥ <b>${S.thr}%</b> (threshold)</li><li>Class CLO attainment % = students at or above threshold ÷ total students × 100</li><li>Levels: ≥${S.lv[0]}% Level 3 (High); ${S.lv[1]}–${S.lv[0]-1}% Level 2 (Medium); ${S.lv[2]}–${S.lv[1]-1}% Level 1 (Low); below ${S.lv[2]}% Not attained</li><li>PLO attainment = Σ(mapping weight × CLO attainment) ÷ Σ(mapping weight), across all courses</li></ul>`)+
 dt('6. Indirect attainment and combined result',`<p>Sources: course-exit survey (per CLO/PLO), alumni survey, employer survey. Convert Likert scores to % (mean ÷ 5 × 100). Indirect % = weighted mean of the three (weights ${S.sw.join('/')}). <b>Combined = ${S.wD}% × Direct + ${S.wI}% × Indirect.</b></p>`)+
 dt('7. CQI template',`<table><tr><th>Gap found<th>Root cause<th>Action taken<th>Responsible / date<th>Re-evaluation (next offering)</tr>${rows([['CLO3 at 50% (target 60%)','Few case-analysis exercises','Added 2 weekly case sessions, revised rubric','Course teacher / Week 3','Class attainment after re-assessment: ___ %']])}</table><p>The Dashboard flags gaps and the CQI tab pre-fills suggestions that you can edit.</p>`)+
 dt('8. BAC/BAETE documentation checklist',`<ul style="list-style:none;padding:0">${['Course file: syllabus, CLOs, Bloom levels, teaching plan','CLO–PLO and PLO–PEO mapping tables','Assessment plan with question-wise CLO mapping','Question papers, model answers, rubrics, moderation forms','Marks sheets and CLO score sheets (this tool: Auto Calculation)','CLO and PLO attainment reports (direct, indirect, combined)','Survey instruments and result summaries','CQI log with re-evaluation evidence','Sample answer scripts (high, medium, low)'].map(x=>`<li><label><input type="checkbox"> ${x}</label></li>`).join('')}</ul>`)+
 dt('9. Worked example: 10 students, 3 CLOs, 2 PLOs',worked(),1)};

V.setup=()=>{
 const f=(l,v,s,t='number')=>`<label>${l}${inp(v,s,t,t==='number'?'min="0" max="100"':'')}</label>`;
 return `<div class="card"><div class="row">${f('Program',S.prog,'S.prog=this.value','text')}${f('Semester',S.sem,'S.sem=this.value','text')}${f('CLO threshold %',S.thr,'S.thr=+this.value')}${f('Level 3 ≥ %',S.lv[0],'S.lv[0]=+this.value')}${f('Level 2 ≥ %',S.lv[1],'S.lv[1]=+this.value')}${f('Level 1 ≥ %',S.lv[2],'S.lv[2]=+this.value')}</div>

function imp(ci){const t=$('#csv').value.trim();if(!t)return;const co=S.courses[ci];
 const rows=t.split(/\r?\n/).map(r=>r.split(/\t|,/).map(x=>x.trim()));
 const cols=co.as.flatMap(a=>a.q.map(q=>({q,k:a.n+'.'+q.n})));
 let start=0,map=cols.map((c,i)=>i+1);
 if(isNaN(+rows[0][1])){start=1;map=cols.map(c=>rows[0].indexOf(c.k))}   // header row: match "Assessment.Question"
 const bad=[];
 const st=rows.slice(start).filter(r=>r[0]).map(r=>{const m={};
  cols.forEach((c,i)=>{const j=map[i];if(j<1||r[j]===undefined||r[j]==='')return;const v=+r[j];
   if(isNaN(v)||v<0||v>c.q.mx){bad.push(r[0]+' '+c.k);return}m[c.q.id]=v});return{n:r[0],m}});

 U(()=>{co.st=st})}

 let h=`<p class="mu">Live results. Hover any number for its formula. Threshold ${th}%.</p>`;
 S.courses.forEach((co,ci)=>{const rs=R.clo.filter(r=>r.ci===ci);
  h+=`<h2>${esc(co.code)} ${esc(co.name)}</h2><h3>a. Per-student CLO score %</h3><div class="sc"><table><tr><th>Student${rs.map(r=>'<th>'+r.lab).join('')}</tr>`+
   co.st.map((s,i)=>`<tr><td>${esc(s.n)}`+rs.map(r=>`<td class="${r.sc[i]>=th?'ok':'bd'}">${F(r.sc[i],'CLO marks obtained ÷ '+r.tot+' × 100')}`).join('')).join('')+`</table></div><p class="note">Score % = marks in CLO-linked questions ÷ total CLO marks × 100. Green = at or above threshold.</p>`+
   `<h3>b. Class CLO attainment</h3><table><tr><th>CLO<th>Students attained<th>Attainment<th>Level<th>Formula</tr>`+rs.map(r=>{const l=lvl(r.att);return`<tr><td>${r.lab}<td>${r.ok}/${r.n}<td>${F(r.att,'students ≥ threshold ÷ total students × 100')}<td>${B(l[0],l[1])}<td class="note">${r.ok} ÷ ${r.n} × 100`}).join('')+`</table>`+
   `<h3>c. Course-wise PLO contribution</h3><table><tr><th>PLO<th>Contribution<th>Formula</tr>`+R.plo.filter(x=>x.byC[ci].a).map(x=>`<tr><td>${x.p.id}<td>${F(x.byC[ci].a.v,'Σ(weight × CLO %) ÷ Σ weight')}<td class="note">${x.byC[ci].a.f}`).join('')+`</table>`});
 h+=`<h2>d. Program-wide PLO attainment</h2><div class="sc"><table><tr><th>PLO<th>Direct<th>Indirect<th>Combined<th>Level<th>Formula</tr>`+R.plo.filter(x=>x.d||x.ind!=null).map(x=>{const l=lvl(x.comb);return`<tr><td>${x.p.id}<td>${F(x.d&&x.d.v,'Σ(weight × CLO %) ÷ Σ weight over all courses')}<td>${F(x.ind,'weighted mean of exit/alumni/employer survey %')}<td>${F(x.comb,S.wD+'% × direct + '+S.wI+'% × indirect')}<td>${B(l[0],l[1])}<td class="note">${x.d?x.d.f:''}${x.ind!=null&&x.d?' | '+S.wD+'%×'+n1(x.d.v)+' + '+S.wI+'%×'+n1(x.ind):''}`}).join('')+`</table></div>`;
 return S.courses.length?h:sel()};

const sug=r=>(r.att<S.lv[2]?'Run remedial classes and a re-test; ':'Add formative practice; ')+'redesign '+r.c.b+'-level questions with worked examples, check question difficulty against the CLO, and share the rubric with students.';
const cq=(k,f,v)=>U(()=>{(S.cqi[k]=S.cqi[k]||{})[f]=v});
function cqiRows(all){const R=calc(),rows=[];
 R.clo.forEach(r=>{if(r.att!=null&&r.att<S.tC)rows.push({ci:r.ci,k:'c'+r.c.id,g:`${r.lab} at ${n1(r.att)}% (target ${S.tC}%)`,s:sug(r)})});
 R.plo.forEach(x=>{if(x.comb!=null&&x.comb<S.tP)rows.push({ci:-1,k:'p'+x.p.id,g:`${x.p.id} at ${n1(x.comb)}% (target ${S.tP}%)`,s:'Review the weakest mapped CLOs, add assessment coverage or a project activity for this PLO, and re-check mapping weights.'})});
 return rows.filter(r=>all||CQF==='all'||(CQF==='c')===(r.ci>=0))}
V.cqi=()=>{const rows=cqiRows();

/* ---------- Download / upload ---------- */
// Save through the page downloads capability; if unavailable, fall back to the copy box (text formats only).
async function save2(name,data,fb){
 if(!window.claude){try{const b=data instanceof Blob?data:new Blob([data],{type:typeof data==='string'?'text/plain':'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();return}catch(e){}}   // normal browser (self-hosted): plain download
 try{const d=window.claude&&await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data})}
 catch(e){if(e&&e.code==='declined')return;
  if(fb!=null&&$('#out')){show(fb);alert('Direct download is unavailable here. The content is in the box below: copy it into a file.')}
  else alert('Download is unavailable in this view. Open the page in a normal browser tab to save files.')}}
const nm=v=>v==null?'':Math.round(v*10)/10;
const xl=()=>window.XLSX||(alert('The Excel library did not load (internet needed). Use CSV instead.'),null);
function wbReport(){const R=calc(),X=XLSX,wb=X.utils.book_new();
 const add=(n,a)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(a),n.replace(/[\\\/?*\[\]:]/g,'-').slice(0,31));
 add('CLO attainment',[['CLO','Statement','Bloom','PLO map','Students','Attained','Attainment %','Level']].concat(R.clo.map(r=>[r.lab,r.c.t,r.c.b,S.plos.filter(p=>r.c.m[p.id]>0).map(p=>p.id+'('+r.c.m[p.id]+')').join(' '),r.n,r.ok,nm(r.att),lvl(r.att)[0]])));
 add('PLO attainment',[['PLO','Outcome','Direct %','Indirect %','Combined %','Level']].concat(R.plo.filter(x=>x.d||x.ind!=null).map(x=>[x.p.id,x.p.n,nm(x.d&&x.d.v),nm(x.ind),nm(x.comb),lvl(x.comb)[0]])));
 S.courses.forEach(co=>{const rs=R.clo.filter(r=>co.clos.includes(r.c));
  add('Scores '+co.code,[['Student'].concat(rs.map(r=>r.lab+' %'))].concat(co.st.map((s,i)=>[s.n].concat(rs.map(r=>nm(r.sc[i]))))))});
 add('CQI',[['Gap','Root cause','Action','Responsible','Re-evaluation']].concat(cqiRows(1).map(r=>{const c=S.cqi[r.k]||{};return[r.g,c.cause||'',c.act==null?r.s:c.act,c.who||'',c.re||'']})));
 return wb}
function dl(name){
 if(name.endsWith('.xlsx')){if(!xl())return;return save2(name,XLSX.write(wbReport(),{type:'array',bookType:'xlsx'}))}
 const t=name.endsWith('.csv')?csv():expJSON();return save2(name,t,t)}
function dlMarks(ci,blank){if(!xl())return;
 const co=S.courses[ci],cols=co.as.flatMap(a=>a.q.map(q=>({q,k:a.n+'.'+q.n}))),rows=[['Student'].concat(cols.map(c=>c.k))];
 if(!blank)co.st.forEach(s=>rows.push([s.n].concat(cols.map(c=>s.m[c.q.id]==null?'':s.m[c.q.id]))));
